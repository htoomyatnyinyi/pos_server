services:
  db:
    image: postgres:16-alpine
    container_name: pos_database

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - mynetwork

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # DO NOT expose postgres publicly unless needed
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pos_server

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

    ports:
      - "6060:6060"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - mynetwork

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6060/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # tunnel:
  #   image: cloudflare/cloudflared:2025.5.0
  #   container_name: pos_tunnel

  #   command: tunnel --no-autoupdate run

  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  #   depends_on:
  #     - app

  #   restart: unless-stopped

  #   networks:
  #     - mynetwork

volumes:
  pgdata:

networks:
  mynetwork:
    driver: bridge

