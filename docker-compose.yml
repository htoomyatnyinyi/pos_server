services:
  db:
    image: postgres:16-alpine
    container_name: pos_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-posdb}
    volumes:
      # Hardcoded to a local folder relative to this directory.
      # This completely prevents accidental data loss from 'down -v'
      - ./pgdata_local:/var/lib/postgresql/data
    networks:
      - mynetwork
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Use the target override so Docker stops compiling the production stages
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: pos_server
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-posdb}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
    ports:
      - "6060:6060"
    volumes:
      - .:/app:Z
      # Anonymous volume ensures container node_modules don't leak to host and vice-versa
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mynetwork
    # Automatically generate Prisma & run your server on startup without full rebuilds
    command: >
      sh -c "bun x prisma generate && bun run src/index.ts"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6060/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mynetwork:
    driver: bridge
